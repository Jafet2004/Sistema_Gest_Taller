<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reportes - Taller Rostrán</title>

    <link rel="stylesheet" href="Estilos/report.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>

<header class="header">
    <h1><i class="fas fa-file-alt"></i> Reportes de Vehículos</h1>
    <a href="index.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver</a>
</header>

<main>

    <!-- FORMULARIO -->
    <section class="form-container">
        <h2>Crear / Editar Reporte</h2>
        <form id="reportForm">
            <div class="row">
                <select id="select_cliente" required>
                    <option value="">Seleccione Cliente</option>
                </select>
                <select id="select_vehiculo" required>
                    <option value="">Seleccione Vehículo</option>
                </select>
            </div>

            <div class="row">
                <select id="select_trabajo" required>
                    <option value="">Seleccione Trabajo</option>
                </select>
                <input type="datetime-local" id="fecha_reporte" required>
            </div>

            <div class="row">
                <textarea id="observaciones" placeholder="Observaciones *" rows="3" required></textarea>
            </div>

            <div class="row">
                <textarea id="recomendaciones" placeholder="Recomendaciones *" rows="3" required></textarea>
            </div>

            <div class="row">
                <button type="submit" class="btn-guardar">
                    <i class="fas fa-save"></i> <span id="btn-text">Guardar Reporte</span>
                </button>
                <button type="button" id="btn-cancelar" class="btn-cancelar">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" id="btn-imprimir-lista" class="btn-imprimir">
                    <i class="fas fa-print"></i> Imprimir Lista
                </button>
                <button type="button" id="btn-descargar-pdf" class="btn-pdf" style="display: none;">
                    <i class="fas fa-file-pdf"></i> Descargar PDF
                </button>
            </div>
        </form>
    </section>

    <!-- TABLA DE REPORTES -->
    <section class="clientes-lista">
        <h2>Reportes Registrados</h2>

        <div class="row" style="margin-bottom: 1rem;">
            <input type="text" id="buscar" placeholder="Buscar por cliente, vehículo o trabajo..." class="input-buscar" style="flex: 3;">
            <button id="btn-refrescar" class="btn-refrescar">
                <i class="fas fa-sync-alt"></i> Actualizar
            </button>
        </div>

        <table id="tablaReportes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Vehículo</th>
                    <th>Trabajo</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- MODAL PARA VER DETALLES -->
    <div id="modalDetalles" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal">&times;</span>
            <div id="modal-contenido"></div>
        </div>
    </div>

</main>

<script src="JS/view_rep.js"></script>
</body>
</html>
