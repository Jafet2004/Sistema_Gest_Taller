<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="JS/auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/Estilos/login.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="logo text-center mb-4">
                            <img src="/src/img_/Logo_comp.png" alt="Logo" class="mb-3" height="120" width="130">
                            <h2>Taller Rostrán</h2>
                            <p class="text-muted">Iniciar sesión para acceder al sistema</p>
                        </div>

                        <!-- Alerta de error / bloqueo -->
                        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre de Usuario</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-2">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" required>
                                    
                                </div><span class="input-group-text bg-white" id="passwordCheckIcon" 
                                    style="display:none; color:#198754;"></span>
                                <small id="passwordHelp" class="form-text text-muted">
                                    Cargando requisitos de la contraseña…
                                </small>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" id="loginBtn" class="btn btn-primary btn-lg">Iniciar sesión</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">¿No tienes una cuenta? <a href="register.html" class="text-decoration-none">Regístrate aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/log.js"></script>
</body>
</html>
