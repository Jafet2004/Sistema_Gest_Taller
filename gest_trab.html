<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="JS/auth.js"></script>
    <title>Gestión de Trabajadores</title>
    <link rel="stylesheet" href="Estilos/trab.css">
    <link rel="stylesheet" href="Estilos/notificaciones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-permisos="trabajadores.ver" data-editar="trabajadores.editar">

<header class="header">
    <h1>Gestión de Trabajadores</h1>
    <a href="index.html" class="btn-volver">Volver</a>
</header>

<main>

    <!-- FORMULARIO -->
    <div class="form-container" data-permiso="trabajadores.editar">
        <h2>Registrar Trabajador</h2>

        <div class="row">
            <input type="text" id="pr_name" placeholder="Primer Nombre">
            <input type="text" id="sc_name" placeholder="Segundo Nombre">
        </div>

        <div class="row">
            <input type="text" id="pr_lastname" placeholder="Primer Apellido">
            <input type="text" id="sc_lastname" placeholder="Segundo Apellido">
        </div>

        <div class="row">
            <input type="text" id="celular" placeholder="Celular">
            <select id="puesto">
                <option value="">Puesto…</option>
                <option>Gerente General</option>
                <option>Asistente Administrativo-Contable</option>
                <option>Encargado de Inventario y Compras</option>
                <option>Asesor de Servicio y Caja</option>
                <option>Jefe de Taller</option>
                <option>Técnico en Diagnóstico</option>
                <option>Mecánico Especializado</option>
                <option>Auxiliar de Taller</option>
            </select>
        </div>

        <div class="row">
            <input type="text" id="especialidad" placeholder="Especialidad (ej. electrónica e híbridos, frenos, motor)" list="especialidades">
            <datalist id="especialidades">
                <option value="Diagnóstico electrónico e híbridos">
                <option value="Motor y transmisión">
                <option value="Frenos y suspensión">
                <option value="Aire acondicionado">
                <option value="Electricidad automotriz">
            </datalist>
        </div>

        <button class="btn-registrar" onclick="registrarTrabajador()">Registrar</button>
    </div>

    <!-- TABLA -->
    <div class="trab-lista">
        <h2>Lista de Trabajadores</h2>

        <input type="text" id="buscar" class="input-buscar" placeholder="Buscar..." onkeyup="filtrarTabla()">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Celular</th>
                    <th>Puesto / especialidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-trabajadores"></tbody>
        </table>
    </div>

</main>

<script src="JS/notificaciones.js"></script>
<script src="JS/trabajadores.js"></script>
</body>
</html>
